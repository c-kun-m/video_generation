name: video-generation
services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD:?Run scripts/dev.ps1 setup first}
      POSTGRES_DB: video_generation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video_generation"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal-postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${VIDEO_TEMPORAL_DB_PASSWORD:?Run scripts/dev.ps1 setup first}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
      - ./temporal/init.sql:/docker-entrypoint-initdb.d/visibility.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 20
  temporal-schema:
    image: temporalio/admin-tools:1.31.0@sha256:b396c1dff819b3653236f3acb65cfcde2bc032822c4202842236fd8a5d6d5898
    platform: linux/amd64
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      SQL_PASSWORD: ${VIDEO_TEMPORAL_DB_PASSWORD}
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
  temporal:
    image: temporalio/server:1.31.0@sha256:d7b3a2f56c599b317494b28e84099c02a096a94005fd20180b54d5ae5a8b3be1
    platform: linux/amd64
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${VIDEO_TEMPORAL_DB_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - ./temporal/dynamic.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
volumes:
  postgres-data:
  temporal-postgres-data:
