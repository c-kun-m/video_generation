[project]
name = "video-generation"
version = "0.2.0"
description = "Local video production control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.52.4,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "temporalio>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[project.scripts]
video-api = "video_generation.cli:serve"
video-admin = "video_generation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_generation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/video_generation/api/routes.py" = ["B008"]
